name: E2E 통합 테스트 (Patrol)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.2'
  JAVA_VERSION: '17'
  XCODE_VERSION: '16.2'

jobs:
  # ──────────────────────────────────────────────────────────────
  # iOS E2E (시뮬레이터)
  # ──────────────────────────────────────────────────────────────
  e2e-ios:
    name: E2E iOS (시뮬레이터)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Patrol CLI 설치
        run: dart pub global activate patrol_cli

      - name: 의존성 설치
        run: flutter pub get
        working-directory: .

      - name: iOS 시뮬레이터 부팅 (iPhone 15)
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 " | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Patrol E2E 테스트 실행 (iOS)
        run: |
          patrol test \
            --target integration_test/auth_flow_test.dart \
            --target integration_test/discovery_test.dart \
            --target integration_test/entry_flow_test.dart \
            --target integration_test/points_test.dart \
            --target integration_test/referral_test.dart \
            --device ${{ env.SIMULATOR_UDID }} \
            --reporter json \
            --output test-results/ios
        env:
          BLOCKPICK_STAGING_URL: ${{ secrets.BLOCKPICK_STAGING_URL }}
          BLOCKPICK_TEST_EMAIL: ${{ secrets.BLOCKPICK_TEST_EMAIL }}
          BLOCKPICK_TEST_PASSWORD: ${{ secrets.BLOCKPICK_TEST_PASSWORD }}

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ios
          path: test-results/ios/
          retention-days: 14

      - name: 스크린샷 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-screenshots-ios
          path: build/patrol/screenshots/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Android E2E (에뮬레이터)
  # ──────────────────────────────────────────────────────────────
  e2e-android:
    name: E2E Android (에뮬레이터)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Patrol CLI 설치
        run: dart pub global activate patrol_cli

      - name: 의존성 설치
        run: flutter pub get

      - name: Android 에뮬레이터 AVD 생성 및 캐시
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: blockpick_test_avd
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            patrol test \
              --target integration_test/auth_flow_test.dart \
              --target integration_test/discovery_test.dart \
              --target integration_test/entry_flow_test.dart \
              --target integration_test/points_test.dart \
              --target integration_test/referral_test.dart \
              --reporter json \
              --output test-results/android
        env:
          BLOCKPICK_STAGING_URL: ${{ secrets.BLOCKPICK_STAGING_URL }}
          BLOCKPICK_TEST_EMAIL: ${{ secrets.BLOCKPICK_TEST_EMAIL }}
          BLOCKPICK_TEST_PASSWORD: ${{ secrets.BLOCKPICK_TEST_PASSWORD }}

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-android
          path: test-results/android/
          retention-days: 14

      - name: 스크린샷 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-screenshots-android
          path: build/patrol/screenshots/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 결과 요약 (Slack 알림 — 선택)
  # ──────────────────────────────────────────────────────────────
  notify:
    name: 결과 알림
    runs-on: ubuntu-latest
    needs: [e2e-ios, e2e-android]
    if: always()

    steps:
      - name: 결과 요약 출력
        run: |
          echo "iOS E2E: ${{ needs.e2e-ios.result }}"
          echo "Android E2E: ${{ needs.e2e-android.result }}"
      # Slack 웹훅 알림 (선택적 활성화)
      # - name: Slack 알림
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
